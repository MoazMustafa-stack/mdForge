<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default(value="Documentation") }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 2rem 1rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            color: #3498db;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        .sidebar nav ul {
            list-style: none;
        }
        .sidebar nav li {
            margin: 0.5rem 0;
        }
        .sidebar nav a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 0.3rem 0;
            display: block;
        }
        .sidebar nav a:hover {
            color: #3498db;
        }
        .content {
            margin-left: 250px;
            flex: 1;
            padding: 2rem 3rem;
            max-width: 1200px;
        }
        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 0.5rem;
        }
        .content h2 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        .content h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            color: #34495e;
        }
        .content code {
            background: #f4f4f4;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .content pre {
            background: #282c34;
            color: #abb2bf;
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .content pre code {
            background: none;
            padding: 0;
            color: inherit;
        }
        .content a {
            color: #3498db;
            text-decoration: none;
        }
        .content a:hover {
            text-decoration: underline;
        }
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .content th, .content td {
            border: 1px solid #ddd;
            padding: 0.75rem;
            text-align: left;
        }
        .content th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .content blockquote {
            border-left: 4px solid #3498db;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #555;
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Documentation</h2>
        {% if navigation %}
        <nav>
            <ul>
            {% for item in navigation %}
                <li><a href="{{ item.url }}">{{ item.title }}</a></li>
            {% endfor %}
            </ul>
        </nav>
        {% endif %}
    </aside>
    
    <main class="content">
        <h1>{{ title | default(value="Documentation") }}</h1>
        {{ content | safe }}
    </main>
</body>
</html>
